<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFO Stakeholders 5Ws Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3e9b3Qf4h+0j4wM9v2p3aY6rQ5F8=" crossorigin="">
  <style>
    :root { font-family: Arial, sans-serif; color: #17365d; }
    body { margin: 0; }
    header { padding: 12px 18px; background: #1f4e78; color: white; }
    header h1 { margin: 0 0 4px; font-size: 1.25rem; }
    header p { margin: 0; font-size: .9rem; }
    #controls { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 18px; background: #eef4fb; }
    #controls label { font-size: .85rem; font-weight: bold; }
    select { margin-left: 5px; padding: 5px; }
    #map { height: calc(100vh - 116px); min-height: 520px; }
    .popup h3 { margin: 0 0 8px; color: #1f4e78; }
    .popup p { margin: 5px 0; line-height: 1.35; }
    .legend { padding: 8px 10px; background: white; line-height: 1.5; box-shadow: 0 0 8px #999; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; }
    .mambasa { background: #2e75b6; } .wamba { background: #70ad47; } .watsa { background: #ed7d31; }
    .note { font-size: .78rem; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>RFO Stakeholders - 5Ws Operational Map</h1>
    <p>Who does What, Where, When and Why | Mambasa, Wamba and Watsa</p>
  </header>
  <div id="controls">
    <label>Territory:
      <select id="territory"><option value="">All</option><option>Mambasa</option><option>Wamba</option><option>Watsa</option></select>
    </label>
    <label>Sector:
      <select id="sector"><option value="">All</option></select>
    </label>
    <span class="note">Coordinates are approximate locality references, not facility-level GPS.</span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const locations = [
      ["Andrada",3.12,29.42,"Watsa",5,"Action Contre La Faim (ACF); CARITAS Développement; Croix-Rouge de la RDC; Médecins Sans Frontières (MSF); UNHCR","Protection; Santé; Sécurité alimentaire; WASH","2026",385896],
      ["Babombi",1.05,28.78,"Mambasa",2,"Wildlife Conservation Global (WCG)","Environnement; Éducation","2026",309169],
      ["Bafwabete",1.15,28.53,"Mambasa",2,"Wildlife Conservation Global (WCG)","Environnement; Éducation","2026",309169],
      ["Biakato",0.87,29.75,"Mambasa",7,"Action Contre La Faim (ACF); CARITAS Développement; Médecins Sans Frontières (MSF); PIDPA / ONGD; UNHCR; UNICEF","Protection; Santé; Sécurité alimentaire; WASH","2026",309169],
      ["Durba",3.01,29.54,"Watsa",5,"Action Contre La Faim (ACF); CARITAS Développement; Croix-Rouge de la RDC; Médecins Sans Frontières (MSF); UNHCR","Protection; Santé; Sécurité alimentaire; WASH","2026",385896],
      ["Ibambi",2.05,28.15,"Wamba",4,"CARITAS Développement; Croix-Rouge de la RDC; UNICEF; World Vision","Protection; Santé; Sécurité alimentaire; WASH","2026",561587],
      ["Lolwa",1.03,29.33,"Mambasa",25,"AAI; AVUDS; CORDAID RDC; IEDA Relief; IRC; MUSACA; PAM; SDC","CASH; Eau, Hygiène et Assainissement; Education; Nutrition; Protection; Santé; Sécurité Alimentaire","2018-2020; 2025; 2025-2026; 2026",309169],
      ["Mambasa",1.55,27.20,"Mambasa",32,"ADECO; Afrilam pour la Lutte Antimines; CORDAID RDC; IEDA Relief; INTERSOS; IRC; MEDES; MUSACA; SDC; TROCAIRE; UNHCR","Administration et gestion des sites; CASH; Multisectoriel; Nutrition; Protection; Santé; Sécurité Alimentaire","2018; 2018-2019; 2018-2020; 2025; 2025-2026; 2026",309169],
      ["Mambasa Centre",1.55,27.20,"Mambasa",7,"Action Contre La Faim (ACF); CARITAS Développement; Médecins Sans Frontières (MSF); PIDPA / ONGD; UNHCR; UNICEF","Protection; Santé; Sécurité alimentaire; WASH","2026",309169],
      ["Mandima",0.95,29.52,"Mambasa",23,"AAI; ADECO; AJCC; AJEDEC; CORDAID RDC; IEDA Relief; IRC; MUSACA; PAM; SDC; VESP","Education; Nutrition; Protection; Santé; Sécurité Alimentaire","2018-2019; 2018-2020; 2025; 2025-2026; 2026",309169],
      ["Nia-Nia",1.65,27.98,"Mambasa",23,"ADECO; ACF; CARITAS Développement; CORDAID RDC; IEDA Relief; PIDPA / ONGD; SDC; Samaritan's Purse; UNHCR","Multisectoriel; Nutrition; Protection; Santé; Sécurité alimentaire","2018; 2018-2019; 2018-2020; 2025-2026; 2026",309169],
      ["Nyangwe",1.35,29.03,"Mambasa",3,"Action Contre La Faim (ACF); Wildlife Conservation Global (WCG)","Environnement; Sécurité alimentaire; Éducation","2026",309169],
      ["Pawa",2.27,27.84,"Wamba",4,"CARITAS Développement; Croix-Rouge de la RDC; UNICEF; World Vision","Protection; Santé; Sécurité alimentaire; WASH","2026",561587],
      ["Wamba Centre",2.14,27.99,"Wamba",5,"Bureau Central de la Zone de Santé de Wamba; CARITAS Développement; Croix-Rouge de la RDC; UNICEF; World Vision","Protection; Santé; Sécurité alimentaire; WASH","2026",561587],
      ["Watsa Centre",3.04,29.54,"Watsa",6,"ACF; Bureau Central de la Zone de Santé de Watsa; CARITAS Développement; Croix-Rouge de la RDC; MSF; UNHCR","Protection; Santé; Sécurité alimentaire; WASH","2026",385896]
    ];
    const map = L.map("map").setView([1.75, 28.8], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    const colors = { Mambasa: "#2e75b6", Wamba: "#70ad47", Watsa: "#ed7d31" };
    const markers = [];
    const sectors = new Set();
    locations.forEach(x => x[6].split("; ").forEach(s => sectors.add(s)));
    const sectorSelect = document.getElementById("sector");
    [...sectors].sort().forEach(s => sectorSelect.add(new Option(s, s)));
    function popup(x) {
      return `<div class="popup"><h3>${x[0]} <small>(${x[3]})</small></h3>
        <p><b>4Ws records:</b> ${x[4]}</p>
        <p><b>Organisations:</b> ${x[5]}</p>
        <p><b>Sectors:</b> ${x[6]}</p>
        <p><b>Operation years:</b> ${x[7]}</p>
        <p><b>Estimated territory population (2024):</b> ${x[8].toLocaleString()}</p>
        <p class="note"><b>Why:</b> Humanitarian response to needs in affected populations. Confirm activity objectives with partners.</p>
        <p class="note">Approximate locality reference: ${x[1].toFixed(2)}° N, ${x[2].toFixed(2)}° E</p></div>`;
    }
    locations.forEach(x => {
      const marker = L.circleMarker([x[1], x[2]], { radius: 8, color: colors[x[3]], fillColor: colors[x[3]], fillOpacity: .8 });
      marker.bindPopup(popup(x)).addTo(map);
      markers.push({ marker, data: x });
    });
    function filter() {
      const territory = document.getElementById("territory").value;
      const sector = sectorSelect.value;
      markers.forEach(item => {
        const match = (!territory || item.data[3] === territory) && (!sector || item.data[6].includes(sector));
        if (match) item.marker.addTo(map); else map.removeLayer(item.marker);
      });
    }
    document.getElementById("territory").addEventListener("change", filter);
    sectorSelect.addEventListener("change", filter);
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = () => {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = "<b>Territory</b><br><span class='dot mambasa'></span>Mambasa<br><span class='dot wamba'></span>Wamba<br><span class='dot watsa'></span>Watsa";
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
